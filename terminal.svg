<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="14">
  <style>
    .t { fill: #c9d1d9; }
    .p { fill: #39d353; font-weight: 600; }
    .d { fill: #58a6ff; font-weight: 600; }
    .c { fill: #8b949e; }
    .w { fill: #e6edf3; font-weight: 600; }
    .type { clip-path: inset(0 100% 0 0); animation: typing 1.2s steps(28) forwards; }
    .type2 { clip-path: inset(0 100% 0 0); animation: typing 1.4s steps(32) forwards; animation-delay: 3.4s; }
    .fade { opacity: 0; animation: fadein 0.3s forwards; }
    .l1 { animation-delay: 1.4s; }
    .l2 { animation-delay: 1.7s; }
    .l3 { animation-delay: 2.0s; }
    .l4 { animation-delay: 4.9s; }
    .l5 { animation-delay: 5.15s; }
    .l6 { animation-delay: 5.4s; }
    .l7 { animation-delay: 5.65s; }
    .l8 { animation-delay: 5.9s; }
    .l9 { animation-delay: 6.15s; }
    .prompt2 { opacity: 0; animation: fadein 0.1s forwards; animation-delay: 3.3s; }
    .prompt3 { opacity: 0; animation: fadein 0.1s forwards; animation-delay: 6.6s; }
    .cursor { animation: blink 1.1s step-end infinite; opacity: 0; animation-delay: 6.7s; }
    @keyframes typing { to { clip-path: inset(0 -2% 0 0); } }
    @keyframes fadein { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="798" height="338" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="34" rx="10" fill="#161b22"/>
  <rect x="1" y="24" width="798" height="12" fill="#161b22"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="18" r="6" fill="#febc2e"/>
  <circle cx="68" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="23" text-anchor="middle" class="c" font-size="12">selim@warsaw: ~</text>

  <!-- line 1: whoami -->
  <text x="20" y="66" class="type"><tspan class="p">selim@warsaw</tspan><tspan class="t">:</tspan><tspan class="d">~</tspan><tspan class="t">$ whoami</tspan></text>
  <text x="20" y="90" class="t fade l1"><tspan class="w">Selim Dalçiçek</tspan> — AI/ML Engineer · CS @ PJATK Warsaw</text>
  <text x="20" y="112" class="t fade l2">Python · FastAPI · PostgreSQL · scikit-learn · XGBoost · AWS · Claude API</text>
  <text x="20" y="134" class="c fade l3">I build and ship real things.</text>

  <!-- line 2: ls projects -->
  <text x="20" y="172" class="type2"><tspan class="p">selim@warsaw</tspan><tspan class="t">:</tspan><tspan class="d">~</tspan><tspan class="t">$ ls projects/ --featured</tspan></text>
  <text x="20" y="196" class="fade l4"><tspan class="d">semesta/</tspan><tspan class="t" dx="12">study OS — FastAPI · React · AWS · Claude API · MCP server · 500+ tests</tspan></text>
  <text x="20" y="218" class="fade l5"><tspan class="d">my-life-be-like/</tspan><tspan class="t" dx="12">Claude agent w/ tool use over PostgreSQL</tspan></text>
  <text x="20" y="240" class="fade l6"><tspan class="d">ai-engineering-lab/</tspan><tspan class="t" dx="12">reliable LLM services — schemas, guardrails</tspan></text>
  <text x="20" y="262" class="fade l7"><tspan class="d">perfume-recommender/</tspan><tspan class="t" dx="12">hybrid ML ranking + GPT-4o-mini, live</tspan></text>
  <text x="20" y="284" class="fade l8"><tspan class="d">THRESHOLD/</tspan><tspan class="t" dx="12">Papers-Please-style game, pure Python stdlib</tspan></text>

  <!-- final prompt + cursor -->
  <text x="20" y="320" class="prompt3"><tspan class="p">selim@warsaw</tspan><tspan class="t">:</tspan><tspan class="d">~</tspan><tspan class="t">$</tspan></text>
  <rect x="86" y="308" width="9" height="16" fill="#39d353" class="cursor"/>
</svg>
